*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b3d5c;font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;user-select:none}
button{font-family:inherit;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1366px;height:768px;transform-origin:0 0;overflow:hidden;background:linear-gradient(#c9efff,#86d0f2 70%,#5bb6e0)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
#safeTag{position:fixed;right:8px;bottom:6px;z-index:2147483647;background:rgba(0,0,0,.72);color:#fff;font-size:14px;padding:4px 12px;border-radius:14px;pointer-events:none;letter-spacing:1px}

/* 偵探證 */
#card{position:absolute;left:14px;top:14px;width:252px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#fffbe6,#ffe9a8);border:3px solid #c9932b;box-shadow:0 4px 0 #a8751c;z-index:110;display:none;font-size:15px;color:#4a3410}
#card .ct{font-size:13px;color:#8a6420;font-weight:bold;letter-spacing:2px}
#card .cn{font-size:22px;font-weight:bold;margin:4px 0 6px}
#card .cr{line-height:1.6}
#card .cr small{color:#a07a30}
#card .money{margin-top:6px;font-size:24px;font-weight:bold;color:#1d7a2c;transition:transform .15s}
#card .money.hit{color:#d22;transform:scale(1.25)}
#card .bdg{font-size:16px;margin-top:2px}
.fly{position:absolute;font-size:26px;font-weight:bold;color:#e22;z-index:70;pointer-events:none;animation:fly 1s forwards}
@keyframes fly{to{transform:translateY(-50px);opacity:0}}

/* 共用按鈕 */
.bigbtn{font-size:30px;font-weight:bold;padding:16px 36px;border-radius:18px;border:none;color:#fff;background:#2b8a3e;box-shadow:0 6px 0 #1b5e28}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1b5e28}
.bigbtn.blue{background:#1971c2;box-shadow:0 6px 0 #0f4a85}
.bigbtn.orange{background:#e8590c;box-shadow:0 6px 0 #a33d06}
.bigbtn.gray{background:#868e96;box-shadow:0 6px 0 #5c636a}
.smbtn{font-size:18px;padding:8px 18px;border-radius:12px;border:2px solid #0f4a85;background:#fff;color:#0f4a85;font-weight:bold}

/* 開始畫面 */
#scr-start{text-align:center}
.title{font-size:84px;font-weight:900;color:#0b4f7a;margin-top:90px;text-shadow:0 5px 0 #fff}
.sub{font-size:28px;color:#11425f;margin:14px 0 50px}
.roundbtns{display:flex;justify-content:center;gap:60px}
.roundbtns .bigbtn{width:330px;font-size:40px;padding:26px 0}
.roundbtns .st{display:block;font-size:20px;font-weight:normal;margin-top:6px}
.fishdeco{position:absolute;font-size:60px;animation:swim 9s linear infinite}
@keyframes swim{from{transform:translateX(-200px)}to{transform:translateX(1600px)}}

/* 領偵探證 */
#scr-get{text-align:center}
#scr-get h2{font-size:44px;color:#0b4f7a;margin:60px 0 20px}
.bigcard{width:560px;margin:0 auto 30px;padding:26px 34px;border-radius:24px;background:linear-gradient(135deg,#fffbe6,#ffe9a8);border:5px solid #c9932b;box-shadow:0 8px 0 #a8751c;text-align:left;font-size:26px;color:#4a3410;animation:flip .8s}
@keyframes flip{from{transform:rotateY(90deg) scale(.6)}to{transform:none}}
.bigcard .cn{font-size:40px;font-weight:bold;margin:6px 0 12px}
.bigcard .row2{line-height:1.8}
.bigcard small{font-size:18px;color:#a07a30}
.getnote{font-size:22px;color:#11425f;margin-bottom:26px}

/* 大廳 */
#scr-lobby .lhead{position:absolute;left:290px;top:22px;font-size:40px;font-weight:bold;color:#0b4f7a}
#scr-lobby .lsub{position:absolute;left:292px;top:80px;font-size:22px;color:#11425f}
.tiles{position:absolute;left:290px;top:130px;width:1050px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tile{height:230px;border-radius:22px;background:#fff;border:4px solid #1971c2;box-shadow:0 6px 0 #0f4a85;display:flex;align-items:center;gap:20px;padding:0 26px;cursor:pointer;position:relative}
.tile:hover{background:#f1f8ff}
.tile .ti{font-size:100px}
.tile .tn{font-size:36px;font-weight:bold;color:#0b4f7a}
.tile .tr{font-size:20px;color:#444;margin-top:6px}
.tile .ts{font-size:22px;margin-top:10px;font-weight:bold;color:#2b8a3e}
.tile.done{border-color:#2b8a3e;box-shadow:0 6px 0 #1b5e28}
.tile .tick{position:absolute;right:18px;top:12px;font-size:50px}
.lfoot{position:absolute;left:290px;top:648px;width:1050px;display:flex;gap:20px;align-items:center}
.lfoot .grow{flex:1}
.lside{position:absolute;left:14px;top:300px;width:252px;font-size:18px;color:#11425f;line-height:1.6;background:rgba(255,255,255,.7);border-radius:14px;padding:12px 14px}

/* 遊戲畫面 */
#gbar{position:absolute;left:280px;top:14px;width:1072px;height:58px;display:flex;align-items:center;gap:16px}
#gtitle{font-size:32px;font-weight:bold;color:#0b4f7a}
#gprog{flex:1;text-align:right;font-size:26px;font-weight:bold;color:#11425f}
#cv{position:absolute;left:280px;top:80px;width:1072px;height:640px;border-radius:16px;border:4px solid #0f4a85;background:#fff}
#ghelp{position:absolute;left:14px;top:300px;width:252px;background:rgba(255,255,255,.85);border-radius:14px;padding:14px;font-size:20px;color:#11425f;line-height:1.6}
#ghelp b{display:inline-block;background:#fff;border:2px solid #555;border-bottom-width:5px;border-radius:8px;padding:0 8px;margin:2px 0;font-size:18px}
#gmsg{position:absolute;left:280px;top:80px;width:1072px;height:640px;border-radius:16px;background:rgba(0,30,60,.55);display:none;align-items:center;justify-content:center;z-index:40}
#gmsg.on{display:flex}
#gmsg .box{background:#fff;border-radius:24px;padding:34px 50px;text-align:center;min-width:480px}
#gmsg .h{font-size:48px;font-weight:bold;color:#0b4f7a}
#gmsg .m{font-size:26px;color:#333;margin:14px 0 26px}
#gmsg .btns{display:flex;gap:20px;justify-content:center}

/* 陷阱彈窗 */
#trapLayer{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center}
#trapLayer.on{display:flex}
.tbox{width:680px;position:relative}
.tool{display:flex;align-items:center;gap:14px;background:#2d3a4a;border-radius:16px 16px 0 0;padding:10px 16px;color:#fff}
.magbtn{font-size:24px;font-weight:bold;padding:8px 18px;border-radius:12px;border:3px solid #ffd43b;background:#fff3bf;color:#5c4400}
.magbtn.active{background:#ffd43b;box-shadow:0 0 0 5px rgba(255,212,59,.5)}
.toolhint{font-size:18px}
.tc{position:relative;background:#eee;border-radius:0 0 16px 16px;padding:18px 40px;transition:opacity .3s}
.tc.guard{pointer-events:none;opacity:.85}

/* ===== 海底偵探社 theme (v2) ===== */
:root{--abyss:#0E3B5C;--lagoon:#2FB3B0;--lagoon-d:#1E8582;--buoy:#FF7A3D;--buoy-d:#C9521F;--sand:#FFF4D6;--kelp:#3E9B5F;--kelp-d:#2A6E42;--foam:#EAF8FB}
html,body{background:#06263d;font-family:"BigFish Round","Microsoft JhengHei",sans-serif}
#stage{background:var(--foam)}
img.em{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;pointer-events:none;-webkit-user-drag:none}
button:focus-visible,.tile:focus-visible{outline:4px solid var(--buoy);outline-offset:3px}

/* buttons: chunky buoy pills */
.bigbtn{border-radius:999px;background:var(--kelp);box-shadow:0 6px 0 var(--kelp-d)}
.bigbtn:active{box-shadow:0 2px 0 var(--kelp-d)}
.bigbtn.blue{background:var(--lagoon);box-shadow:0 6px 0 var(--lagoon-d)}
.bigbtn.orange{background:var(--buoy);box-shadow:0 6px 0 var(--buoy-d)}
.smbtn{border-radius:999px;border-color:var(--abyss);color:var(--abyss)}

/* headings in abyss */
#scr-get h2,#scr-lobby .lhead,#gtitle,#gmsg .h,.res .rname,.rp h2,.rp .ttl,#scr-tpw h2,.ttext .tn,.tsum h2,.ttabs .tt{color:var(--abyss)}
#scr-lobby .lsub,.getnote,#gprog,.lside,#ghelp{color:var(--abyss)}

/* detective ID card: laminated card with a header stripe */
#card,.bigcard{background:var(--sand);border:3px solid var(--abyss);box-shadow:0 5px 0 var(--abyss);color:var(--abyss)}
.bigcard{border-width:4px;box-shadow:0 8px 0 var(--abyss);width:660px}
.bigcard small{white-space:nowrap}
#card .ct{background:var(--abyss);color:var(--sand);margin:-12px -14px 8px;padding:6px 14px;border-radius:12px 12px 0 0;letter-spacing:1px}
#card .cr small,.bigcard small{color:#7a6a45}
#card .money{color:var(--kelp-d)}
#card .money.hit{color:var(--buoy-d)}

/* lobby tiles */
.tile{border:4px solid var(--abyss);box-shadow:0 6px 0 var(--abyss)}
.tile:hover{background:var(--foam)}
.tile .tn{color:var(--abyss)}
.tile .ts{color:var(--kelp-d)}
.tile.done{border-color:var(--kelp-d);box-shadow:0 6px 0 var(--kelp-d)}
#cv{border-color:var(--abyss)}

/* results */
.res-safe .rbig,.rs-safe{color:var(--lagoon-d)}
.res-caught .rbig,.rs-caught{color:var(--buoy-d)}
.res .soft{color:var(--kelp-d)}
.rp,#scr-report .rp{border-color:var(--abyss)}
.rp th{background:var(--foam)}

/* detective's handwritten notes */
.res .rsay,.ttext .say,.ttext .q,.tsum .m .d,.tsum .m .a,.rp td:last-child{font-family:"BigFish Hand","BigFish Round",sans-serif}
.res .rsay{font-size:27px;line-height:1.45;color:#2b2b2b}
.rp td:last-child{font-size:19px}

/* ---------- start screen: the hook ---------- */
#scr-start{text-align:left;background:linear-gradient(#c6f1f7 0%,#7fd3e2 28%,#2f97b6 62%,#0E3B5C 100%);overflow:hidden}
#scr-start .wave{position:absolute;left:0;top:0;width:1366px;height:70px}

#scr-start .floor{position:absolute;left:0;bottom:0;width:1366px;height:170px}
#scr-start .title{position:absolute;left:110px;top:120px;margin:0;font-size:96px;font-weight:900;color:#fff;letter-spacing:4px;-webkit-text-stroke:14px var(--abyss);paint-order:stroke fill;text-shadow:0 8px 0 var(--abyss)}
#scr-start .sub{position:absolute;left:116px;top:270px;margin:0;font-size:30px;line-height:1.6;color:var(--abyss)}
#scr-start .roundbtns{position:absolute;left:110px;top:420px;justify-content:flex-start;gap:36px}
#scr-start .roundbtns .bigbtn{width:300px}
.rig{position:absolute;left:968px;top:-10px;width:4px;height:430px;transform-origin:50% 0;animation:sway 4.2s ease-in-out infinite}

.curious{position:absolute;left:1070px;top:390px;width:150px;height:150px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(0,0)}50%{transform:translate(-14px,6px)}}
.curious+.q1{position:absolute;left:1180px;top:350px;font-size:44px;font-weight:900;color:#fff;-webkit-text-stroke:8px var(--abyss);paint-order:stroke fill}

/* win bubbles */
.bubble{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.9) 0 18%,rgba(255,255,255,.15) 22%);z-index:45;pointer-events:none;animation:rise 1.8s ease-in forwards}
@keyframes rise{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-560px) scale(1.1);opacity:0}}
#scr-start .weeds img{position:absolute;bottom:0;width:128px;height:128px}

.mute{position:absolute;left:14px;bottom:14px;z-index:160;width:54px;height:54px;border-radius:50%;border:3px solid var(--abyss);background:#fff;font-size:26px;line-height:1;padding:0;box-shadow:0 4px 0 var(--abyss)}

#scr-teacher{background:#f4fbfc}

.tile{border-radius:28px;gap:26px;padding:0 28px 0 22px}

.tile .tick{right:20px;top:14px}

/* trap popup + results */

#scr-report .rp{border-width:4px;box-shadow:0 8px 0 var(--abyss);border-radius:26px;height:736px}
.rp .sb{background:var(--foam);border:2px solid #cfe9ef}
.rp tr:nth-child(odd) td{background:#f7fcfd}

/* toast + confirm */
#toast{background:var(--sand);border-color:var(--abyss);color:var(--abyss);border-radius:999px;box-shadow:0 4px 0 var(--abyss)}
#modal{background:rgba(6,38,61,.55)}
#modal .box{border:4px solid var(--abyss);box-shadow:0 8px 0 var(--abyss);border-radius:28px;color:var(--abyss)}

/* teacher */
.ttab{border-radius:999px;border-color:var(--abyss);color:var(--abyss)}
.ttab.on{background:var(--abyss);color:#fff}
.tli{border-radius:14px}
.tli.on{background:var(--sand);border-color:var(--buoy)}
.ttext .q{background:var(--foam)}
.ttext .tc2{background:var(--sand)}
.tpv{background:#dcecf1}
.tsum{border:3px solid var(--abyss)}
#tpw{border-color:var(--abyss);border-radius:999px;padding:10px 24px}
@media (prefers-reduced-motion:reduce){.rig,.curious,.bubble,.fishdeco{animation:none!important}}
</style>
</head>

/* ===== 狀態（只存在這台電腦） ===== */
function blank(){return {v:1,cur:0,r:{}};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1&&s.r&&typeof s.r==='object')return s;}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load()||blank();
const R=()=>S.r[S.cur];
function newRound(){const f=FISH[Math.floor(Math.random()*FISH.length)];return {fish:f[0]+'偵探',emo:f[1],money:1000,res:{},done:{}};}
function record(r,n,kind){if(r.res[n])return 0;r.res[n]=kind;let cost=0;if(kind==='caught'){cost=Math.min(COST[n],r.money);r.money-=cost;}return cost;}
function counts(r){const c={spot:0,safe:0,caught:0};if(r)for(let n=1;n<=8;n++)if(r.res[n])c[r.res[n]]++;return c;}
function titleOf(s){return s>=7?['🦈','鯊魚級偵探']:s>=4?['🐬','海豚級偵探']:['🐟','小心別當大魚！'];}

/* ===== 畫面縮放 ===== */
const stage=$('#stage');let K=1;
function fit(){K=Math.min(innerWidth/1366,innerHeight/768);stage.style.transform=`scale(${K})`;stage.style.left=(innerWidth-1366*K)/2+'px';stage.style.top=(innerHeight-768*K)/2+'px';}
addEventListener('resize',fit);fit();
function toStage(cx,cy){const b=stage.getBoundingClientRect();return [(cx-b.left)/K,(cy-b.top)/K];}


/* ===== v2：3D 表情圖（Fluent Emoji, MIT）===== */
const emKey=s=>s.replace(/️/g,'');
const EMR=/\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*/gu;
function swapEm(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),list=[];
  while(w.nextNode()){const n=w.currentNode,p=n.parentNode;if(!p||/^(SCRIPT|STYLE|TEXTAREA|OPTION|PRE)$/.test(p.nodeName))continue;EMR.lastIndex=0;if(EMR.test(n.nodeValue))list.push(n);}
  list.forEach(n=>{const s=n.nodeValue,f=document.createDocumentFragment();let last=0,hit=false;
    s.replace(EMR,(m,off)=>{const src=EM[emKey(m)];if(!src)return m;hit=true;f.append(s.slice(last,off));const i=new Image();i.className='em';i.alt=m;i.src=src;i.draggable=false;f.append(i);last=off+m.length;return m;});
    if(!hit)return;f.append(s.slice(last));n.replaceWith(f);});
  if(root.nodeType===1){const b=root.matches&&root.matches('.bait,.curious')?[root]:root.querySelectorAll('.bait,.curious');b.forEach(x=>{const i=x.querySelector('img.em');if(i){i.style.width=i.style.height='100%';}});}
}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)swapEm(n);else if(n.nodeType===3&&n.parentNode)swapEm(n.parentNode);}}).observe(document.getElementById('stage'),{childList:true,subtree:true});
swapEm(document.getElementById('stage'));
const EMI={};
function emImg(t){const k=emKey(t);if(!(k in EMI)){const s=EM[k];EMI[k]=s?Object.assign(new Image(),{src:s}):null;}return EMI[k];}
function bubbles(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<22;i++){const b=document.createElement('div');b.className='bubble';const s=18+Math.random()*46;b.style.cssText=`width:${s}px;height:${s}px;left:${300+Math.random()*1030}px;top:${640+Math.random()*90}px;animation-delay:${(Math.random()*.6).toFixed(2)}s`;stage.appendChild(b);setTimeout(()=>b.remove(),2600);}}

let MUTE=false;try{MUTE=localStorage.getItem('bigfish_mute')==='1';}catch(e){}
function sfx(k,v){if(MUTE||!SFX[k])return;try{const a=new Audio(SFX[k]);a.volume=v||.5;const p=a.play();if(p)p.catch(()=>{});}catch(e){}}
const muteBtn=document.getElementById('muteBtn');
function paintMute(){muteBtn.textContent=MUTE?'🔇':'🔊';muteBtn.title=MUTE?'打開聲音':'關掉聲音';muteBtn.setAttribute('aria-label',muteBtn.title);}
muteBtn.onclick=()=>{MUTE=!MUTE;try{localStorage.setItem('bigfish_mute',MUTE?'1':'0');}catch(e){}paintMute();sfx('click',.35);};paintMute();
document.addEventListener('click',e=>{if(e.target.closest('#muteBtn'))return;if(e.target.closest('button,.tile,.tli,.ttab'))sfx('click',.35);});

function bigCard(r){return `<div style="font-size:22px;color:#8a6420;font-weight:bold;letter-spacing:3px">🪪 偵探證・第${S.cur===1?'一':'二'}堂</div><div class="cn">${r.emo} ${r.fish}</div><div class="row2">📞 電話：${PHONE}<br>💳 卡號：${CARDNO} <small>（遊戲用）</small><br>💰 零用錢：<b>1000 元</b>（遊戲幣）</div>`;}

function renderStart(){[1,2].forEach(k=>{const r=S.r[k];$('#r'+k+'st').textContent=r?(GAMES.every(g=>r.done[g.id])?'✅ 已完成':'▶ 繼續玩'):'';});show('start');}
function pickRound(k){S.cur=k;if(!S.r[k]){S.r[k]=newRound();save();$('#bigcard').innerHTML=bigCard(S.r[k]);show('get');}else{save();toLobby();}}
function toLobby(){if(G){G.halt=true;}G=null;$('#gmsg').classList.remove('on');const r=R();
  $('#tiles').innerHTML=GAMES.map(g=>{const d=r.done[g.id];const sp=g.traps.filter(n=>r.res[n]==='spot').length;
    return `<div class="tile ${d?'done':''}" data-g="${g.id}"><div class="ti">${g.icon}</div><div><div class="tn">${g.name}</div><div class="tr">${g.rule}</div><div class="ts">${d?`識破 ${sp} / 2 個陷阱`:''}</div></div>${d?'<div class="tick">✅</div>':''}</div>`;}).join('');
  document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>startGame(t.dataset.g));
  $('#reportBtn').style.display=GAMES.every(g=>r.done[g.id])?'':'none';show('lobby');}

/* ===== 陷阱彈窗 ===== */
let trapOpen=null;
function openTrap(n,cb){
  const r=R(),t=T[S.cur][n];if(document.activeElement)document.activeElement.blur();
  sfx('trap',.5);const L=$('#trapLayer');L.className='on';
  L.innerHTML=`<div class="tbox"><div class="tool"><button class="magbtn" id="magBtn">🔍 放大鏡</button><span class="toolhint">覺得怪怪的？先按 🔍，再點可疑的地方。</span></div><div class="tc guard" id="tc">${t.html(r)}</div></div>`;
  const tc=$('#tc');trapOpen={n,cb,t,mag:false,done:false,cleanup:t.setup?t.setup(tc):null};
  setTimeout(()=>tc.classList.remove('guard'),700);
  $('#magBtn').onclick=()=>setMag(!trapOpen.mag);
  tc.addEventListener('click',onTrapClick,true);
}
function setMag(on){if(!trapOpen)return;if(on!==trapOpen.mag)sfx('mag',.4);trapOpen.mag=on;$('#trapLayer').classList.toggle('mag',on);const b=$('#magBtn');if(b){b.classList.toggle('active',on);b.textContent=on?'🔍 取消放大鏡':'🔍 放大鏡';}}
function onTrapClick(e){
  if(!trapOpen||trapOpen.done)return;e.preventDefault();e.stopPropagation();const t=trapOpen.t;
  if(trapOpen.mag){if(e.target.closest('[data-hot]'))finishTrap('spot');else again(e);return;}
  const f=e.target.closest('[data-fill]');if(f){f.textContent=f.dataset.fill;f.classList.add('filled');return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;

  if(curScreen!=='game'||!G)return;
  if(GAMEKEYS.includes(e.key))e.preventDefault();
  if($('#gmsg').classList.contains('on')){if((e.key===' '||e.key==='Enter')&&G.msgFn&&!e.repeat)G.msgFn();return;}
  keys[e.key]=true;if(G.key&&!e.repeat)G.key(e.key);});
addEventListener('keyup',e=>{keys[e.key]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ===== 報告 ===== */
function renderReport(){const r=R(),c=counts(r),[te,tn]=titleOf(c.spot);const r1=S.cur===2?S.r[1]:null;const c1=r1?counts(r1):null;
  const lab=k=>k?`<span class="rs-${k}">${RES_LABEL[k]}</span>`:'<span class="rs-none">— 沒遇到</span>';
  let cmp='';if(c1){cmp=`<div class="cmp">第一堂識破 <b>${c1.spot}</b> 個 → 第二堂 <b>${c.spot}</b> 個${c.spot>c1.spot?'<br><span class="up">🎉 你進步了！</span>':''}</div>`;}
  const rows=[1,2,3,4,5,6,7,8].map(n=>{const t=T[S.cur][n];return `<tr><td>${n}</td><td class="nm">${CAT[t.cat]} ${t.name}</td><td class="rs">${lab(r.res[n])}</td>${r1?`<td class="rs">${lab(r1.res[n])}</td>`:''}<td>${t.say}</td></tr>`;}).join('');
  $('#rp').innerHTML=`<div class="rhead"><h2>📜 ${r.emo} ${r.fish} 的揭秘報告（第${S.cur===1?'一':'二'}堂）</h2><button class="bigbtn blue" id="rpBack" style="font-size:24px;padding:8px 24px">🏠 回大廳</button></div>
  <div class="stats"><div class="sb">🔍 識破<b class="rs-spot">${c.spot}</b></div><div class="sb">🚪 安全離開<b class="rs-safe">${c.safe}</b></div><div class="sb">🐟 中招<b class="rs-caught">${c.caught}</b></div><div class="sb">💰 零用錢${r.money>0?`<b class="mny">你守住了 ${r.money} 元</b>`:'<b class="mny zero">零用錢被釣光了！</b>'}</div></div>
  <div class="ttl"><span class="te">${te}</span>你的稱號：${tn}${cmp}</div>
  <table><tr><th>#</th><th>陷阱的名字</th><th>你的結果</th>${r1?'<th>第一堂</th>':''}<th>這招在做什麼</th></tr>${rows}</table>
  <div class="rfoot"><span style="font-size:18px;color:#666">很多大人也會被騙喔！記住這些招數，下次就不會上當。</span></div>`;
  $('#rpBack').onclick=toLobby;show('report');}

/* ===== 老師揭秘模式 ===== */
const tv={r:1,i:1};
function renderTeacher(){document.querySelectorAll('.ttab').forEach(b=>b.classList.toggle('on',+b.dataset.r===tv.r));
  const list=[1,2,3,4,5,6,7,8].map(n=>{const t=T[tv.r][n];return `<div class="tli ${tv.i===n?'on':''}" data-i="${n}">${n}. ${CAT[t.cat]} ${t.name.replace(/（.*）/,'')}</div>`;}).join('')+`<div class="tli ${tv.i===9?'on':''}" data-i="9">⭐ 五招總整理</div>`;
  $('#tlist').innerHTML=list;document.querySelectorAll('.tli').forEach(e=>e.onclick=()=>{tv.i=+e.dataset.i;renderTeacher();});
  const M=$('#tmain');
  if(tv.i===9){M.innerHTML=`<div class="tsum"><h2>⭐ 五招總整理：騙子的五個字</h2>${FIVE.map(f=>`<div class="m"><span class="k">${f[0]}</span><span class="d">${f[1]}</span><span class="a">→ ${f[2]}</span></div>`).join('')}</div>`;return;}
  const t=T[tv.r][tv.i],g=GAMES.find(g=>g.traps.includes(tv.i));
  M.innerHTML=`<div class="tpv"><div class="pv" id="pv">${t.html({fish:'小丑魚偵探',emo:'🐠'})}</div></div><div class="ttext"><div class="tc2">${g.icon} ${g.name}・${CAT[t.cat]} ${t.cat}</div><div class="tn">${t.name}</div><div class="say">${t.say}</div><div class="q">💬 想一想：${t.q}</div><div class="nav">紅圈＝可疑的地方　｜　${tv.i} / 8</div></div>`;
  requestAnimationFrame(()=>{const pv=$('#pv');if(!pv)return;const box=pv.parentElement;const s=Math.min(1,(box.clientWidth-20)/pv.offsetWidth,(box.clientHeight-30)/pv.offsetHeight);pv.style.transform=`scale(${s})`;
    const h=pv.querySelector('[data-hot]');if(!h)return;const pr=pv.getBoundingClientRect(),hr=h.getBoundingClientRect(),k=pr.width/pv.offsetWidth;
    const ring=document.createElement('div');ring.className='redring';const pad=14;ring.style.left=((hr.left-pr.left)/k-pad)+'px';ring.style.top=((hr.top-pr.top)/k-pad)+'px';ring.style.width=(hr.width/k+pad*2)+'px';ring.style.height=(hr.height/k+pad*2)+'px';pv.appendChild(ring);});}
function openTeacher(){show('teacher');renderTeacher();}

/* ===== 綁定 ===== */
$('#r1btn').onclick=()=>pickRound(1);$('#r2btn').onclick=()=>pickRound(2);
$('#enterLobby').onclick=toLobby;$('#backStart').onclick=renderStart;$('#toLobby').onclick=toLobby;
$('#reportBtn').onclick=renderReport;
$('#restartBtn').onclick=()=>confirmBox('要清除<b>這台電腦</b>的遊戲紀錄嗎？<br><span style="font-size:22px;color:#666">（給下一班的同學用，清除後不能復原）</span>',()=>{try{localStorage.removeItem(KEY);}catch(e){}S=blank();renderStart();toast('紀錄已清除');});
document.querySelectorAll('.ttab').forEach(b=>b.onclick=()=>{tv.r=+b.dataset.r;tv.i=1;renderTeacher();});
const tryPw=()=>{if($('#tpw').value==='naes5922023'){$('#tpw').value='';openTeacher();}else $('#terr').textContent='密碼不對喔';};
$('#tpwBtn').onclick=tryPw;$('#tpw').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw();});

/* ===== 自我測試（網址加 ?selftest=1） ===== */
function runSelfTest(){const out=[];let ok=true;const chk=(c,m)=>{out.push((c?'OK   ':'FAIL ')+m);if(!c)ok=false;};
  const box=document.createElement('div');document.body.appendChild(box);
  for(const rd of [1,2])for(let n=1;n<=8;n++){const t=T[rd][n];box.innerHTML=t.html({fish:'測試偵探',emo:'🐟'});
    chk(box.querySelectorAll('[data-hot]').length===1,`R${rd}-T${n} 剛好一個可疑點`);
    chk(!!box.querySelector('[data-act=safe]'),`R${rd}-T${n} 有安全離開的方法`);
    chk(!!box.querySelector('[data-act=caught],[data-act=pay]'),`R${rd}-T${n} 有中招按鈕`);
    chk(t.name&&t.say&&t.q&&CAT[t.cat],`R${rd}-T${n} 揭秘文字齊全`);
    chk(!box.querySelector('input,textarea,[contenteditable]'),`R${rd}-T${n} 沒有可自由打字的框`);
    if(t.setup){const c=t.setup(box);chk(typeof c==='function',`R${rd}-T${n} 動態效果可清除`);c();}}
  box.remove();
  const r=newRound();chk(r.money===1000&&/偵探$/.test(r.fish),'新偵探證 1000 元、魚類名字');
  chk(record(r,1,'caught')===397&&r.money===603,'陷阱1 中招扣 397');
  chk(record(r,1,'caught')===0&&r.money===603,'同一陷阱只記第一次');
  record(r,2,'spot');chk(r.money===603&&r.res[2]==='spot','識破不扣錢');
  record(r,3,'safe');chk(r.money===603,'安全離開不扣錢');
  record(r,4,'caught');chk(r.money===303,'陷阱4 扣 300');
  record(r,5,'caught');record(r,6,'caught');chk(r.money===3,'陷阱5、6 各扣 150');
  record(r,7,'caught');chk(r.money===0,'扣到 0 停在 0');record(r,8,'caught');chk(r.money===0,'不會變負數');
  const c=counts(r);chk(c.spot===1&&c.safe===1&&c.caught===6,'結果統計正確');
  chk(titleOf(8)[1]==='鯊魚級偵探'&&titleOf(7)[1]==='鯊魚級偵探'&&titleOf(6)[1]==='海豚級偵探'&&titleOf(4)[1]==='海豚級偵探'&&titleOf(3)[1]==='小心別當大魚！'&&titleOf(0)[1]==='小心別當大魚！','稱號分級');
  const keep=S;S={v:1,cur:2,r:{1:r,2:newRound()}};save();const L=load();chk(L&&L.r[1].res[1]==='caught'&&L.cur===2,'存檔讀回');
  try{localStorage.removeItem(KEY);}catch(e){}chk(load()===null,'重新開始能清除');S=keep;save();
  chk(getComputedStyle($('#safeTag')).position==='fixed'&&$('#safeTag').textContent.includes('不會真的扣錢'),'角落標示存在');
  document.body.appendChild(Object.assign(document.createElement('pre'),{className:'selftest',textContent:(ok?'ALL PASS\n\n':'有失敗項目\n\n')+out.join('\n')}));
  window.SELFTEST_OK=ok;}

window.BF={get S(){return S;},T,record,openTrap,finishTrap,get G(){return G;},get trapOpen(){return trapOpen;},startGame,toLobby,pickRound,renderReport};
if(Q.has('selftest'))runSelfTest();
else if(Q.has('teacher'))show('tpw');
else renderStart();
</script>
